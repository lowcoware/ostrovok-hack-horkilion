syntax = "proto3";

package common.v1;

import "google/protobuf/timestamp.proto";

option go_package = "horkilion/gen/common/v1;commonv1";

// Source records where the data of an entity came from. An entity carries
// several sources when its fields come from different places: a hotel's name
// and location from OSM, its price generated on top of them.
message Source {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // Loaded as is from an open dataset or API.
    KIND_REAL = 1;
    // Generated by us.
    KIND_SYNTHETIC = 2;
    // Computed from real data, e.g. a climate estimate from past weather.
    KIND_DERIVED = 3;
  }

  // Machine name of the provider: "osm", "ourairports", "open-meteo", "synthetic".
  string provider = 1;
  Kind kind = 2;
  // Which fields this source covers: "location", "price", "*".
  string field_scope = 3;
  // Dataset or API page, empty for synthetic data.
  string url = 4;
  // SPDX license id: "ODbL-1.0", "CC-BY-4.0".
  string license = 5;
  google.protobuf.Timestamp fetched_at = 6;
}

message GeoPoint {
  double lat = 1;
  double lon = 2;
}

// Place is a point travellers move between: a city, an airport, a station, a hotel.
message Place {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_CITY = 1;
    KIND_AIRPORT = 2;
    KIND_STATION = 3;
    KIND_HOTEL = 4;
    KIND_ADDRESS = 5;
  }

  // Provider id of the place, empty for free-form addresses.
  string id = 1;
  string name = 2;
  Kind kind = 3;
  // ISO 3166-1 alpha-2.
  string country_code = 4;
  GeoPoint point = 5;
  // IANA time zone, e.g. "Europe/Moscow". Times at this place are given in it.
  string timezone = 6;
  // IATA code for airports, ESR code for stations.
  string code = 7;
}

// Travelers is who goes on the trip. Prices and placement depend on the age of
// each child, so ages are given instead of a count.
message Travelers {
  int32 adults = 1;
  repeated int32 child_ages = 2;
  bool pets = 3;
}
