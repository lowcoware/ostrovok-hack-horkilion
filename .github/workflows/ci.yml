name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # main runs CI through the deploy workflow
  workflow_call:
    outputs:
      backend:
        description: Go services changed, their images need a rebuild
        value: ${{ jobs.changes.outputs.backend }}
      web:
        description: Frontend changed, the web image needs a rebuild
        value: ${{ jobs.changes.outputs.web }}
      docs:
        description: Documentation changed, the docs image needs a rebuild
        value: ${{ jobs.changes.outputs.docs }}

permissions:
  contents: read

jobs:
  # Decides which parts of the monorepo changed, so a frontend-only change
  # checks and rebuilds only the frontend. Any doubt means "everything changed".
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      web: ${{ steps.diff.outputs.web }}
      docs: ${{ steps.diff.outputs.docs }}
      deploy: ${{ steps.diff.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No usable base commit, treating everything as changed"
            files=".github/"
          else
            files=$(git diff --name-only "$BASE" HEAD)
          fi
          printf '%s\n' "$files"
          changed() { grep -qE "$1|^\.github/" <<<"$files" && echo true || echo false; }
          {
            echo "backend=$(changed '^(api|cmd|config|internal|gen|migrations|proto|scripts)/|^go\.(mod|sum)$|^Dockerfile$|^\.dockerignore$')"
            echo "web=$(changed '^(api|web)/|^redocly\.yaml$')"
            echo "deploy=$(changed '^deploy/')"
            echo "docs=$(changed '^(docs|docs-site)/')"
          } | tee -a "$GITHUB_OUTPUT"

  go:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install protoc and plugins
        run: |
          curl -sSfL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v36.2/protoc-36.2-linux-x86_64.zip
          sudo unzip -qo /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: Generated Go code matches proto/
        run: |
          ./scripts/gen-proto.sh
          git add -N gen
          git diff --exit-code gen || { echo "::error::gen/ is stale: run scripts/gen-proto.sh and commit"; exit 1; }
      - name: gofmt
        run: test -z "$(gofmt -l api cmd internal migrations)"
      - run: go vet ./...
      - run: go test -race ./...

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint OpenAPI
        run: npx -y @redocly/cli@2.71.0 lint ../api/openapi.yaml --config ../redocly.yaml
      - name: TS types match api/openapi.yaml
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.ts || { echo "::error::web/src/api/schema.ts is stale: run npm run gen:api and commit"; exit 1; }
      - run: npm test
      - run: npm run build

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
      - run: npm run build

  # Keep a Changelog 1.1.0 with a commit hash in every entry. Runs on pull requests only: after a
  # squash or rebase merge the branch hashes are not in main, and that must not block the deploy.
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python3 scripts/check-changelog.py CHANGELOG.md

  compose:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose files
        working-directory: deploy
        run: |
          sed -E 's/^([A-Z_]*(PASSWORD|AUTH|SECRET|SALT|ENCRYPTION_KEY))=$/\1=ci/' .env.example > ci.env
          docker compose --env-file ci.env -f docker-compose.yml -f docker-compose.build.yml config -q
