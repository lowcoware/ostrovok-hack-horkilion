name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # main runs CI through the deploy workflow
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal migrations)"
      - run: go vet ./...
      - run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose files
        working-directory: deploy
        run: |
          sed -E 's/^([A-Z_]*(PASSWORD|AUTH|SECRET|SALT|ENCRYPTION_KEY))=$/\1=ci/' .env.example > ci.env
          docker compose --env-file ci.env -f docker-compose.yml -f docker-compose.build.yml config -q
