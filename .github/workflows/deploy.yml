name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # All Go images share one tag and rebuild together; web is separate.
        include:
          - { service: gateway, group: backend }
          - { service: agent, group: backend }
          - { service: inventory, group: backend }
          - { service: booking, group: backend }
          - { service: notifier, group: backend }
          - { service: migrate, group: backend }
          - { service: web, group: web }
          - { service: docs, group: docs }
    env:
      CHANGED: ${{ needs.ci.outputs[matrix.group] }}
    steps:
      - uses: actions/checkout@v7
        if: env.CHANGED == 'true'
      - name: Registry name (GHCR requires lowercase)
        if: env.CHANGED == 'true'
        run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
        if: env.CHANGED == 'true'
      - uses: docker/login-action@v4
        if: env.CHANGED == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        if: env.CHANGED == 'true'
        with:
          context: ${{ matrix.service == 'web' && 'web' || '.' }}
          # docs builds from the repository root (it needs docs/), with its Dockerfile in docs-site/.
          file: ${{ matrix.service == 'docs' && 'docs-site/Dockerfile' || '' }}
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/horkilion-${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/horkilion-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: [ci, build]
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || 'horkilion' }}
      BACKEND_CHANGED: ${{ needs.ci.outputs.backend }}
      WEB_CHANGED: ${{ needs.ci.outputs.web }}
      DOCS_CHANGED: ${{ needs.ci.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
      - name: Registry name (GHCR requires lowercase)
        run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking yes
          EOF

      - name: Copy deploy files
        run: |
          ssh server "mkdir -p '$DEPLOY_PATH'"
          scp -r deploy/docker-compose.yml deploy/.env.example deploy/server-env.sh deploy/caddy deploy/postgres \
            deploy/clickhouse deploy/prometheus deploy/grafana "server:$DEPLOY_PATH/"

      - name: Prepare .env on the server
        # The first deploy creates .env with fresh secrets; every deploy writes the
        # values kept in GitHub into it. The LLM key goes over stdin, never into a
        # command line. Empty variables leave the value in .env untouched.
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          SITE_ADDRESS: ${{ vars.SITE_ADDRESS }}
          LANGFUSE_ADDRESS: ${{ vars.LANGFUSE_ADDRESS }}
          GRAFANA_ADDRESS: ${{ vars.GRAFANA_ADDRESS }}
          LANGFUSE_URL: ${{ vars.LANGFUSE_URL }}
          API_ADDRESS: ${{ vars.API_ADDRESS }}
        run: |
          printf '%s' "$LLM_API_KEY" | ssh server "bash '$DEPLOY_PATH/server-env.sh' '$REGISTRY' \
            '$SITE_ADDRESS' '$LANGFUSE_ADDRESS' '$GRAFANA_ADDRESS' '$LANGFUSE_URL' '$API_ADDRESS'"

      - name: Log in to GHCR on the server
        # The token goes over stdin, never into a command line on the server.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | ssh server "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Pull and start
        run: |
          ssh server "bash -s" <<EOF
          set -euo pipefail
          cd '$DEPLOY_PATH'
          test -f .env || { echo ".env is missing on the server, the previous step should have created it"; exit 1; }
          # .image-tags remembers what runs now. Only the changed group gets
          # the new tag, so compose leaves the other containers alone.
          touch .image-tags
          . ./.image-tags
          BACKEND_TAG="\${BACKEND_TAG:-latest}" WEB_TAG="\${WEB_TAG:-latest}" DOCS_TAG="\${DOCS_TAG:-latest}"
          [ '$BACKEND_CHANGED' = true ] && BACKEND_TAG='${{ github.sha }}'
          [ '$WEB_CHANGED' = true ] && WEB_TAG='${{ github.sha }}'
          [ '$DOCS_CHANGED' = true ] && DOCS_TAG='${{ github.sha }}'
          export IMAGE_REGISTRY='$REGISTRY' BACKEND_TAG WEB_TAG DOCS_TAG
          echo "backend: \$BACKEND_TAG, web: \$WEB_TAG, docs: \$DOCS_TAG"
          docker compose pull --quiet
          docker compose up -d --remove-orphans
          # Prometheus and Grafana read their mounted configs only on start.
          if docker compose ps --services --status running | grep -qx grafana; then docker compose restart prometheus grafana; fi
          # This script arrives on stdin: every command that could read stdin gets
          # </dev/null, or it swallows the rest of the script.
          for i in \$(seq 1 30); do
            if docker compose exec -T gateway /app healthcheck </dev/null; then echo "gateway is healthy"; break; fi
            if [ "\$i" = 30 ]; then docker compose ps; docker compose logs --tail=50 gateway booking agent migrate; exit 1; fi
            sleep 5
          done
          printf 'BACKEND_TAG=%s\nWEB_TAG=%s\nDOCS_TAG=%s\n' "\$BACKEND_TAG" "\$WEB_TAG" "\$DOCS_TAG" > .image-tags
          docker image prune -f
          EOF

      - name: Log out of GHCR on the server
        if: always()
        run: ssh server "docker logout ghcr.io" || true
