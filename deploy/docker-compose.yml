# Full stack: services, frontend, PostgreSQL, NATS, Langfuse (with ClickHouse,
# Redis, MinIO), Prometheus and Grafana. Secrets come from deploy/.env, see
# .env.example. Only Caddy (web) publishes ports.

x-service: &service
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "/app", "healthcheck"]
    interval: 10s
    timeout: 3s
    retries: 5
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

x-db-url: &db-url postgres://horkilion:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/horkilion?sslmode=disable

services:
  # --- Application ----------------------------------------------------------

  migrate:
    image: ${IMAGE_REGISTRY:-horkilion}/horkilion-migrate:${BACKEND_TAG:-latest}
    restart: "no"
    environment:
      DATABASE_URL: *db-url
    depends_on:
      postgres: { condition: service_healthy }

  # Supplier services. Each runs the provider named in its *_PROVIDER variable;
  # an unknown name stops the container at start with the allowed values.
  inventory:
    <<: *service
    image: ${IMAGE_REGISTRY:-horkilion}/horkilion-inventory:${BACKEND_TAG:-latest}
    environment:
      CATALOG_PROVIDER: ${CATALOG_PROVIDER:-open-data}
      LODGING_PROVIDER: ${LODGING_PROVIDER:-osm}
      TRANSPORT_PROVIDER: ${TRANSPORT_PROVIDER:-synthetic}
      TRANSFER_PROVIDER: ${TRANSFER_PROVIDER:-stub}

  booking:
    <<: *service
    image: ${IMAGE_REGISTRY:-horkilion}/horkilion-booking:${BACKEND_TAG:-latest}
    environment:
      DATABASE_URL: *db-url
      NATS_URL: nats://nats:4222
      INVENTORY_ADDR: inventory:9000
    depends_on:
      migrate: { condition: service_completed_successfully }
      nats: { condition: service_started }
      inventory: { condition: service_healthy }

  agent:
    <<: *service
    image: ${IMAGE_REGISTRY:-horkilion}/horkilion-agent:${BACKEND_TAG:-latest}
    environment:
      DATABASE_URL: *db-url
      NATS_URL: nats://nats:4222
      INVENTORY_ADDR: inventory:9000
      # Any OpenAI-compatible endpoint. OPENROUTER_API_KEY is read when LLM_API_KEY is empty.
      LLM_API_KEY: ${LLM_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek/deepseek-v4.1-flash}
      LLM_ROUTER_MODEL: ${LLM_ROUTER_MODEL:-qwen/qwen3.8-27b}
      # JSON merged into every LLM request; empty means {"provider":{"data_collection":"deny"}}.
      LLM_EXTRA_BODY: ${LLM_EXTRA_BODY:-}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
      # Traces go to the project Langfuse creates from LANGFUSE_INIT_*; empty keys disable tracing.
      LANGFUSE_HOST: http://langfuse-web:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
      nats: { condition: service_started }
      inventory: { condition: service_healthy }

  gateway:
    <<: *service
    image: ${IMAGE_REGISTRY:-horkilion}/horkilion-gateway:${BACKEND_TAG:-latest}
    environment:
      DATABASE_URL: *db-url
      NATS_URL: nats://nats:4222
      BOOKING_ADDR: booking:9000
    depends_on:
      migrate: { condition: service_completed_successfully }
      nats: { condition: service_started }
      booking: { condition: service_healthy }

  notifier:
    <<: *service
    image: ${IMAGE_REGISTRY:-horkilion}/horkilion-notifier:${BACKEND_TAG:-latest}
    environment:
      NATS_URL: nats://nats:4222
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    depends_on:
      nats: { condition: service_started }

  # Frontend + reverse proxy with automatic TLS.
  web:
    image: ${IMAGE_REGISTRY:-horkilion}/horkilion-web:${WEB_TAG:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "3000:3000"
      - "3001:3001"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      LANGFUSE_ADDRESS: ${LANGFUSE_ADDRESS:-:3000}
      GRAFANA_ADDRESS: ${GRAFANA_ADDRESS:-:3001}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      gateway: { condition: service_healthy }

  # --- Infrastructure -------------------------------------------------------

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: horkilion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: horkilion
      TZ: UTC
      PGTZ: UTC
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>.
      - postgres_data:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horkilion -d horkilion"]
      interval: 3s
      timeout: 3s
      retries: 20

  nats:
    # Scratch image: no shell or wget, so no health check. Services wait for
    # the connection themselves (platform.ConnectNATS).
    image: nats:2.15-scratch
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats_data:/data

  # --- Langfuse (LLM traces); its ClickHouse also hosts the analytics database

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    restart: unless-stopped
    depends_on: &langfuse-depends-on
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      redis: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    environment: &langfuse-env
      NEXTAUTH_URL: ${LANGFUSE_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://horkilion:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT:?set LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?set LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${REDIS_AUTH:?set REDIS_AUTH}

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?set LANGFUSE_NEXTAUTH_SECRET}
      # Optional first organization, project and admin user, created on start.
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}

  clickhouse:
    image: clickhouse/clickhouse-server:25.12-alpine
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: wget -q --spider http://127.0.0.1:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: cgr.dev/chainguard/minio
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: --requirepass ${REDIS_AUTH} --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_AUTH}", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  # --- Metrics --------------------------------------------------------------

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:12.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_PLUGINS_PREINSTALL: grafana-clickhouse-datasource
      GF_USERS_ALLOW_SIGN_UP: "false"
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - clickhouse

volumes:
  postgres_data:
  nats_data:
  caddy_data:
  caddy_config:
  clickhouse_data:
  clickhouse_logs:
  minio_data:
  redis_data:
  prometheus_data:
  grafana_data:
