apiVersion: 1

# Dashboards live as JSON in deploy/grafana/dashboards, generated by
# deploy/grafana/gen_dashboards.py. Edits made in the UI are not saved.
providers:
  - name: horkilion
    folder: Horkilion
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/dashboards
