apiVersion: 1

# Grafana cannot change the uid of an existing data source, so the ones created
# before the uids were fixed are deleted and recreated on start.
# impulse: deleted and recreated on every start, drop this list once every
# installation has started with the fixed uids.
deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: ClickHouse analytics
    orgId: 1

datasources:
  # Fixed uids: the provisioned dashboards refer to the data sources by uid.
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: ClickHouse analytics
    uid: clickhouse
    type: grafana-clickhouse-datasource
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      username: clickhouse
      defaultDatabase: analytics
    secureJsonData:
      password: $CLICKHOUSE_PASSWORD
