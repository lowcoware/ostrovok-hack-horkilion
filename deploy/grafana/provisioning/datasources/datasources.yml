apiVersion: 1

datasources:
  # Fixed uids: the provisioned dashboards refer to the data sources by uid.
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: ClickHouse analytics
    uid: clickhouse
    type: grafana-clickhouse-datasource
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      username: clickhouse
      defaultDatabase: analytics
    secureJsonData:
      password: $CLICKHOUSE_PASSWORD
